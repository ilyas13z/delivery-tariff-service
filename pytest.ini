[pytest]
# Минимальная версия pytest
minversion = 7.0
asyncio_default_fixture_loop_scope = function

# Директории с тестами
testpaths = tests

# Паттерн для поиска тестовых файлов
python_files = test_*.py

# Паттерн для поиска тестовых классов
python_classes = Test*

# Паттерн для поиска тестовых функций
python_functions = test_*

# Маркеры для тестов
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark test as integration test
    unit: mark test as unit test

# Опции вывода
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --asyncio-mode=auto
    -p no:warnings

# Настройки асинхронных тестов
asyncio_mode = auto

# Отображать локальные переменные в трейсбеках
showlocals = true

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
