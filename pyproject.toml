[project]
name = "delivery-tariff-service"
version = "0.1.0"
package-mode = false

packages = [
    { include = "delivery_tariff", from = "src" }
]

description = "Service for calculating delivery costs"
authors = [
    {name = "ilyas13z",email = "ilyas13z@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "certifi (>=2025.8.3,<2026.0.0)",
    "redis (>=6.4.0,<7.0.0)",
    "celery (>=5.5.3,<6.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.3.0,<5.0.0)",
    "ruff (>=0.13.0,<0.14.0)",
    "types-requests (>=2.32.4.20250913,<3.0.0.0)",
    "types-redis (>=4.6.0.20241004,<5.0.0.0)",
    "detect-secrets (>=1.5.0,<2.0.0)",
    "pytest (==7.2.0)",
    "pytest-asyncio (==0.20.3)",
]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py313"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "ASYNC", # async best practices
    "Q",   # quotes
]
ignore = [
    "E501",
]

[isort]
known-first-party = ["app"]
combine-as-imports = true

[per-file-ignores]
"tests/*" = ["S101"]

[flake8-quotes]
docstring-quotes = "double"
multiline-quotes = "double"

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B113", "B101"]
